<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Vista previa de la migración a React del editor y comparador de contratos OpenAPI.">
  <title>Editor OpenAPI (vista previa React)</title>
  <link rel="icon" href="./assets/logo.svg" type="image/svg+xml">
  <script>
    (() => {
      const systemTheme = () => matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      try {
        const settings = JSON.parse(localStorage.getItem('oat.settings.v1') || '{}');
        const theme = ['light', 'dark', 'system'].includes(settings.theme) ? settings.theme : 'system';
        const dark = (theme === 'system' ? systemTheme() : theme) === 'dark';
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (_) { document.documentElement.dataset.theme = systemTheme(); }
    })();
  </script>
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./src/presentation/app.css">
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./src/main.tsx"></script>
</body>
</html>
